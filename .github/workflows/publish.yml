name: CI

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: Run tests
        run: bun test
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Typecheck scripts and examples
        run: bunx tsc -p tsconfig.scripts.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Independent finance conformance
        run: bun run test:finance-conformance

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Use npm 11.5.1+
        run: npm install -g npm@11.5.1

      - name: Set version from tag
        run: npm version ${GITHUB_REF#refs/tags/v} --no-git-tag-version --allow-same-version

      - name: Publish
        run: npm publish --provenance --access public
