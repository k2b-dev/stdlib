name: CI

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: Fetch DATEV XML schemas and samples
        # Downloads DATEV's archives from the pinned URLs and checks their SHA-256.
        # DATEV's files are not in this repository; a vanished URL fails the build.
        run: bun run datev:fixtures
      - name: Run tests
        run: bun test
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Typecheck scripts and examples
        run: bunx tsc -p tsconfig.scripts.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Independent finance conformance
        run: bun run test:finance-conformance
      - name: Read independent original CII invoices
        run: bun run test:einvoice-external

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Use npm 11.5.1+
        run: npm install -g npm@11.5.1

      - name: Check tag, package.json and main
        # Publish only what is on main, with the version reviewed in package.json.
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match package.json version $version."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit $GITHUB_SHA is not on main."
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public
